# Minimal SPIRE server config (illustrative).
# A working SPIFFE deployment also requires a spire-agent per node and a
# node/workload attestation policy — tune this before real use.
server {
    bind_address = "0.0.0.0"
    bind_port    = "8081"
    trust_domain = "custodian.local"
    data_dir     = "/opt/spire/data"
    log_level    = "INFO"
}

plugins {
    DataStore "sql" {
        plugin_data {
            database_type = "sqlite3"
            connection_string = "/opt/spire/data/datastore.sqlite3"
        }
    }

    NodeAttestor "join_token" {
        plugin_data {}
    }

    KeyManager "disk" {
        plugin_data {
            keys_path = "/opt/spire/data/keys.json"
        }
    }
}
