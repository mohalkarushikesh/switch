<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Custodian — Accounts Payable</title>
  <!-- Montserrat: the site typeface, matching the React app. From Google Fonts. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* Styled after the U.S. Web Design System (USWDS): primary blue #005ea2,
       ink #1b1b1b, cool grays, squared corners, Montserrat throughout. Light. */
    :root {
      --bg: #f0f0f0; --panel: #ffffff; --panel2: #f5f6f7; --panel3: #dfe1e2;
      --text: #1b1b1b; --muted: #565c65; --border: #dfe1e2;
      --blue: #005ea2; --blue-dark: #1a4480; --green: #008817; --amber: #c05600; --red: #b50909;
      --focus: #2491ff; --radius: 4px;
      --font: "Montserrat", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: var(--font); line-height: 1.5;
      background: var(--bg); color: var(--text); font-size: 15px;
      -webkit-font-smoothing: antialiased;
    }
    .gov-banner { background: var(--panel3); color: var(--text); font-size: 12px; }
    .gov-banner__inner { max-width: 1100px; margin: 0 auto; padding: 6px 24px; display: flex; align-items: center; gap: 8px; }
    header {
      padding: 18px 24px; border-bottom: 1px solid var(--border);
      border-top: 4px solid var(--blue); background: var(--panel);
      display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
      box-shadow: 0 1px 4px rgba(27,27,27,.08);
    }
    header h1 { font-size: 20px; font-weight: 700; margin: 0; }
    .pill {
      background: var(--panel2); padding: 4px 10px; border-radius: 999px;
      color: var(--muted); font-size: 12px; box-shadow: inset 0 0 0 1px var(--border);
    }
    .pill b { color: var(--text); }
    main { padding: 24px; max-width: 1100px; margin: 0 auto; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
    button {
      background: var(--blue); color: white; border: none; padding: 9px 16px;
      border-radius: var(--radius); cursor: pointer; font-size: 14px;
      font-family: inherit; font-weight: 600;
    }
    button:hover { background: var(--blue-dark); }
    button.ghost { background: var(--panel2); color: var(--text); box-shadow: inset 0 0 0 1px var(--border); }
    button.ghost:hover { background: var(--panel3); }
    button.ok { background: var(--green); }
    button.bad { background: var(--red); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 4px solid var(--focus); outline-offset: 0; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover { background: var(--panel2); }
    .badge {
      display: inline-block; padding: 3px 9px; border-radius: var(--radius);
      font-size: 12px; font-weight: 700;
    }
    .badge.paid { background: #ecf3ec; color: #216e1f; }
    .badge.needs_review { background: #faf3d1; color: #8a6a00; }
    .badge.rejected { background: #f4e3db; color: #b50909; }
    .badge.failed { background: #f4e3db; color: #b50909; }
    .risk-bar {
      display: inline-block; width: 80px; height: 8px; border-radius: 4px;
      background: var(--panel3); vertical-align: middle; overflow: hidden;
    }
    .risk-fill { height: 100%; }
    .trail {
      background: var(--panel2); border-left: 4px solid var(--blue);
      padding: 12px 16px; margin: 0; font-size: 13px; color: var(--muted); border-radius: var(--radius);
    }
    .trail li { margin: 4px 0; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
    .actions button { padding: 5px 10px; font-size: 12px; }
    .empty { color: var(--muted); padding: 24px; text-align: center; }
    h2 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
    input, textarea {
      background: var(--panel); border: 1px solid var(--muted); color: var(--text);
      border-radius: var(--radius); padding: 9px 10px; font-size: 14px; width: 100%; font-family: inherit;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 3px; font-weight: 500; }
    .field { margin-bottom: 8px; }
  </style>
</head>
<body>
  <section class="gov-banner" aria-label="Official website notice">
    <div class="gov-banner__inner">
      <span aria-hidden="true">🇺🇸</span>
      <span>An official website of the U.S. government</span>
    </div>
  </section>
  <header>
    <h1>🛡️ Custodian</h1>
    <span class="pill">Scoring: <b id="mode">…</b></span>
    <span class="pill">Model: <b id="model">…</b></span>
    <span class="pill">Ledger: <b id="ledger">…</b></span>
  </header>

  <main>
    <div class="row">
      <button id="load-samples">Load sample invoices</button>
      <button class="ghost" id="refresh">Refresh</button>
      <button class="ghost" id="toggle-form">Submit an invoice ▾</button>
      <input id="api-key" placeholder="API key (only if auth enabled)"
             style="max-width:260px" title="Sent as X-API-Key on write requests" />
    </div>

    <div class="panel" id="form-panel" style="display:none; margin-bottom:20px;">
      <h2>Submit invoice</h2>
      <div class="grid">
        <div class="field"><label>Invoice ID</label><input id="f-id" value="INV-100"></div>
        <div class="field"><label>Vendor name</label><input id="f-vendor" value="New Vendor Co"></div>
        <div class="field"><label>Vendor account</label><input id="f-acct" value="NVC-CHK-100200"></div>
        <div class="field"><label>Amount (INR)</label><input id="f-amount" type="number" value="2500"></div>
        <div class="field"><label>Issue date</label><input id="f-issue" value="2026-08-15"></div>
        <div class="field"><label>Due date</label><input id="f-due" value="2026-09-15"></div>
      </div>
      <div class="field"><label>Line items (comma separated)</label><input id="f-items" value="Consulting, Support"></div>
      <div class="field"><label>Memo</label><input id="f-memo" value="Q3 services — contact ap@newvendor.com or +91 98765 43210"></div>
      <button id="submit-invoice">Run through pipeline</button>
    </div>

    <div class="panel">
      <h2>Processed invoices</h2>
      <table>
        <thead>
          <tr><th>Invoice</th><th>Vendor</th><th>Amount</th><th>Risk</th><th>Status</th><th>Actions</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty">No invoices yet — click “Load sample invoices”.</div>
    </div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const money = (n) => n.toLocaleString('en-IN', { style: 'currency', currency: 'INR' });
    let expanded = null; // invoice_id whose audit trail is open

    // Sample invoices mirrored from data/sample_invoices for the "Load samples"
    // button. Memos embed PII (emails + phone numbers) so the Data-governance
    // layer visibly redacts it — see "redacted_pii" on each processed invoice.
    const SAMPLES = [
      { invoice_id:"INV-001", vendor_name:"Acme Office Supplies", vendor_account:"ACME-CHK-889201", amount:1240.50, issue_date:"2026-08-10", due_date:"2026-09-10", line_items:["Paper","Ink — reorder: supplies@acme-office.com"], memo:"Monthly office supply order. Queries: ap@acme-office.com or +91 98765 43210." },
      { invoice_id:"INV-002", vendor_name:"Skyline Construction Co", vendor_account:"SKY-CHK-4410233", amount:48250.00, issue_date:"2026-08-01", due_date:"2026-08-31", line_items:["Phase 2 work — foreman +91 90012 34567"], memo:"Progress payment 2 of 4. Site lead: rakesh@skyline-build.in, +91 90000 12345." },
      { invoice_id:"INV-003", vendor_name:"QuickPay Global Ltd", vendor_account:"X12", amount:75000.00, issue_date:"2026-08-25", due_date:"2026-08-26", line_items:["Consulting — invoices to billing@quickpay-global.co"], memo:"URGENT: wire now, changed bank details. Confirm to finance@quickpay-global.co or +91 98111 22333." },
      { invoice_id:"INV-004", vendor_name:"Bright Cleaning Services", vendor_account:"BRIGHT-CHK-77120", amount:3000.00, issue_date:"2026-08-20", due_date:"2026-08-05", line_items:["Weekly cleaning — supervisor priya@brightclean.in"], memo:"Standard monthly cleaning. Billing: billing@brightclean.in, 022-4455-6677." },
    ];

    const riskColor = (s) => s >= 75 ? 'var(--red)' : s >= 31 ? 'var(--amber)' : 'var(--green)';

    async function refreshMeta() {
      const [h, l] = await Promise.all([
        fetch('/health').then(r => r.json()),
        fetch('/ledger').then(r => r.json()),
      ]);
      // Name the provider when an LLM is live, so "llm (huggingface)" is visible.
      $('mode').textContent = h.provider ? `${h.scoring_mode} (${h.provider})` : h.scoring_mode;
      $('model').textContent = h.model;
      $('ledger').textContent = money(l.balance);
    }

    async function refreshRows() {
      const records = await fetch('/invoices').then(r => r.json());
      const tbody = $('rows');
      tbody.innerHTML = '';
      $('empty').style.display = records.length ? 'none' : 'block';

      for (const rec of records) {
        const inv = rec.invoice, a = rec.assessment || {}, score = a.risk_score ?? 0;
        const tr = document.createElement('tr');
        tr.className = 'clickable';
        tr.innerHTML = `
          <td>${inv.invoice_id}</td>
          <td>${inv.vendor_name}</td>
          <td>${money(inv.amount)}</td>
          <td>
            <span class="risk-bar"><span class="risk-fill" style="width:${score}%;background:${riskColor(score)}"></span></span>
            ${score}
          </td>
          <td><span class="badge ${rec.status}">${rec.status.replace('_',' ')}</span></td>
          <td class="actions"></td>`;
        // Approve / reject actions only for the review queue.
        const cell = tr.querySelector('.actions');
        if (rec.status === 'needs_review') {
          const ok = document.createElement('button');
          ok.className = 'ok'; ok.textContent = 'Approve';
          ok.onclick = (e) => { e.stopPropagation(); act(inv.invoice_id, 'approve'); };
          const bad = document.createElement('button');
          bad.className = 'bad'; bad.textContent = 'Reject';
          bad.onclick = (e) => { e.stopPropagation(); act(inv.invoice_id, 'reject'); };
          cell.append(ok, bad);
        }
        tr.onclick = () => { expanded = expanded === inv.invoice_id ? null : inv.invoice_id; renderTrail(tbody, tr, rec); };
        tbody.appendChild(tr);
        if (expanded === inv.invoice_id) renderTrail(tbody, tr, rec);
      }
    }

    function renderTrail(tbody, afterRow, rec) {
      // Remove any existing trail row for a clean re-render.
      const next = afterRow.nextElementSibling;
      if (next && next.classList.contains('trail-row')) { next.remove(); if (expanded !== rec.invoice.invoice_id) return; }
      if (expanded !== rec.invoice.invoice_id) return;
      const tr = document.createElement('tr');
      tr.className = 'trail-row';
      const items = (rec.audit_trail || []).map(s => `<li>${s}</li>`).join('');
      tr.innerHTML = `<td colspan="6"><ul class="trail">${items}</ul></td>`;
      afterRow.after(tr);
    }

    // Attach the API key (if provided) so writes work when auth is enabled.
    function writeHeaders(json = false) {
      const h = {};
      if (json) h['Content-Type'] = 'application/json';
      const key = $('api-key').value.trim();
      if (key) h['X-API-Key'] = key;
      return h;
    }

    async function act(id, action) {
      const resp = await fetch(`/invoices/${id}/${action}`, { method: 'POST', headers: writeHeaders() });
      if (!resp.ok) { alert(`${action} failed: ${(await resp.json()).detail}`); return; }
      await refreshAll();
    }

    async function submitOne(payload) {
      const resp = await fetch('/invoices', {
        method: 'POST', headers: writeHeaders(true),
        body: JSON.stringify(payload),
      });
      if (!resp.ok) alert('Submit failed: ' + (await resp.text()));
    }

    async function refreshAll() { await Promise.all([refreshMeta(), refreshRows()]); }

    $('load-samples').onclick = async () => { for (const s of SAMPLES) await submitOne(s); await refreshAll(); };
    $('refresh').onclick = refreshAll;
    $('toggle-form').onclick = () => {
      const p = $('form-panel');
      p.style.display = p.style.display === 'none' ? 'block' : 'none';
    };
    $('submit-invoice').onclick = async () => {
      await submitOne({
        invoice_id: $('f-id').value, vendor_name: $('f-vendor').value,
        vendor_account: $('f-acct').value, amount: parseFloat($('f-amount').value),
        issue_date: $('f-issue').value, due_date: $('f-due').value,
        line_items: $('f-items').value.split(',').map(s => s.trim()).filter(Boolean),
        memo: $('f-memo').value,
      });
      await refreshAll();
    };

    refreshAll();
  </script>
</body>
</html>
