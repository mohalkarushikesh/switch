      - DATABASE_URL=postgresql://oryza_user:oryza_pass@postgres:5432/oryza_db
      - REDIS_URL=redis://redis:6379
      - BROKER_API_KEY=${BROKER_API_KEY}
      - BROKER_SECRET=${BROKER_SECRET}
    ports:
      - "8008:8008"
    depends_on:
      - postgres
      - redis
    networks:
      - oryza-network
    volumes:
      - ./backend/services/execution-agent:/app
      - ./backend/shared:/app/shared
    command: uvicorn src.main:app --host 0.0.0.0 --port 8008 --reload

  wealth-concierge:
    build:
      context: ./backend/services/wealth-concierge
      dockerfile: Dockerfile
    container_name: oryza-wealth-concierge
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://oryza_user:oryza_pass@postgres:5432/oryza_db
      - REDIS_URL=redis://redis:6379
      - MONGODB_URL=mongodb://oryza_user:oryza_pass@mongodb:27017/oryza_db
      - NEO4J_URL=bolt://neo4j:7687
    ports:
      - "8011:8011"
    depends_on:
      - postgres
      - redis
      - mongodb
      - neo4j
    networks:
      - oryza-network
    volumes:
      - ./backend/services/wealth-concierge:/app
      - ./backend/shared:/app/shared
    command: uvicorn src.main:app --host 0.0.0.0 --port 8011 --reload

  compliance-monitor:
    build:
      context: ./backend/services/compliance-monitor
      dockerfile: Dockerfile
    container_name: oryza-compliance-monitor
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://oryza_user:oryza_pass@postgres:5432/oryza_db
      - REDIS_URL=redis://redis:6379
      - MONGODB_URL=mongodb://oryza_user:oryza_pass@mongodb:27017/oryza_db
    ports:
      - "8009:8009"
    depends_on:
      - postgres
      - redis
      - mongodb
    networks:
      - oryza-network
    volumes:
      - ./backend/services/compliance-monitor:/app
      - ./backend/shared:/app/shared
    command: uvicorn src.main:app --host 0.0.0.0 --port 8009 --reload

  tax-optimizer:
    build:
      context: ./backend/services/tax-optimizer
      dockerfile: Dockerfile
    container_name: oryza-tax-optimizer
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://oryza_user:oryza_pass@postgres:5432/oryza_db
      - REDIS_URL=redis://redis:6379
    ports:
      - "8012:8012"
    depends_on:
      - postgres
      - redis
    networks:
      - oryza-network
    volumes:
      - ./backend/services/tax-optimizer:/app
      - ./backend/shared:/app/shared
    command: uvicorn src.main:app --host 0.0.0.0 --port 8012 --reload

  social-trading:
    build:
      context: ./backend/services/social-trading
      dockerfile: Dockerfile
    container_name: oryza-social-trading
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://oryza_user:oryza_pass@postgres:5432/oryza_db
      - REDIS_URL=redis://redis:6379
      - MONGODB_URL=mongodb://oryza_user:oryza_pass@mongodb:27017/oryza_db
    ports:
      - "8013:8013"
    depends_on:
      - postgres
      - redis
      - mongodb
    networks:
      - oryza-network
    volumes:
      - ./backend/services/social-trading:/app
      - ./backend/shared:/app/shared
    command: uvicorn src.main:app --host 0.0.0.0 --port 8013 --reload

  education-hub:
    build:
      context: ./backend/services/education-hub
      dockerfile: Dockerfile
    container_name: oryza-education-hub
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://oryza_user:oryza_pass@postgres:5432/oryza_db
      - REDIS_URL=redis://redis:6379
    ports:
      - "8014:8014"
    depends_on:
      - postgres
      - redis
    networks:
      - oryza-network
    volumes:
      - ./backend/services/education-hub:/app
      - ./backend/shared:/app/shared
    command: uvicorn src.main:app --host 0.0.0.0 --port 8014 --reload

  risk-profiler:
    build:
      context: ./backend/services/risk-profiler
      dockerfile: Dockerfile
    container_name: oryza-risk-profiler
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://oryza_user:oryza_pass@postgres:5432/oryza_db
      - REDIS_URL=redis://redis:6379
    ports:
      - "8015:8015"
    depends_on:
      - postgres
      - redis
    networks:
      - oryza-network
    volumes:
      - ./backend/services/risk-profiler:/app
      - ./backend/shared:/app/shared
    command: uvicorn src.main:app --host 0.0.0.0 --port 8015 --reload

  market-maker:
    build:
      context: ./backend/services/market-maker
      dockerfile: Dockerfile
    container_name: oryza-market-maker
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://oryza_user:oryza_pass@postgres:5432/oryza_db
      - REDIS_URL=redis://redis:6379
    ports:
      - "8016:8016"
    depends_on:
      - postgres
      - redis
    networks:
      - oryza-network
    volumes:
      - ./backend/services/market-maker:/app
      - ./backend/shared:/app/shared
    command: uvicorn src.main:app --host 0.0.0.0 --port 8016 --reload

  fraud-detector:
    build:
      context: ./backend/services/fraud-detector
      dockerfile: Dockerfile
    container_name: oryza-fraud-detector
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://oryza_user:oryza_pass@postgres:5432/oryza_db
      - REDIS_URL=redis://redis:6379
    ports:
      - "8017:8017"
    depends_on:
      - postgres
      - redis
    networks:
      - oryza-network
    volumes:
      - ./backend/services/fraud-detector:/app
      - ./backend/shared:/app/shared
    command: uvicorn src.main:app --host 0.0.0.0 --port 8017 --reload

  backtesting-engine:
    build:
      context: ./backend/services/backtesting-engine
      dockerfile: Dockerfile
    container_name: oryza-backtesting-engine
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://oryza_user:oryza_pass@postgres:5432/oryza_db
      - REDIS_URL=redis://redis:6379
    ports:
      - "8018:8018"
    depends_on:
      - postgres
      - redis
    networks:
      - oryza-network
    volumes:
      - ./backend/services/backtesting-engine:/app
      - ./backend/shared:/app/shared
    command: uvicorn src.main:app --host 0.0.0.0 --port 8018 --reload

  payment-gateway:
    build:
      context: ./backend/services/payment-gateway
      dockerfile: Dockerfile
    container_name: oryza-payment-gateway
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://oryza_user:oryza_pass@postgres:5432/oryza_db
      - REDIS_URL=redis://redis:6379
    ports:
      - "8019:8019"
    depends_on:
      - postgres
      - redis
    networks:
      - oryza-network
    volumes:
      - ./backend/services/payment-gateway:/app
      - ./backend/shared:/app/shared
    command: uvicorn src.main:app --host 0.0.0.0 --port 8019 --reload

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oryza-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:8080/api/v1
      - REACT_APP_WS_URL=ws://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway
    networks:
      - oryza-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm start

  # Monitoring
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: oryza-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - oryza-network

  grafana:
    image: grafana/grafana:10.2.2
    container_name: oryza-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
    depends_on:
      - prometheus
    networks:
      - oryza-network

  # ML Platform
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.8.1
    container_name: oryza-mlflow
    ports:
      - "5000:5000"
    environment:
      - BACKEND_STORE_URI=postgresql://oryza_user:oryza_pass@postgres:5432/mlflow
      - ARTIFACT_ROOT=/mlruns
    volumes:
      - mlflow_data:/mlruns
    networks:
      - oryza-network
    command: >
      mlflow server 
      --backend-store-uri postgresql://oryza_user:oryza_pass@postgres:5432/mlflow
      --default-artifact-root /mlruns
      --host 0.0.0.0

networks:
  oryza-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  neo4j_data:
  influxdb_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
  mlflow_data:
