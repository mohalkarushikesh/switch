      - ./backend/shared:/app/shared
    command: uvicorn src.main:app --host 0.0.0.0 --port 8003 --reload

  news-sentiment:
    build:
      context: ./backend/services/news-sentiment
      dockerfile: Dockerfile
    container_name: oryza-news-sentiment
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://oryza_user:oryza_pass@postgres:5432/oryza_db
      - MONGODB_URL=mongodb://oryza_user:oryza_pass@mongodb:27017/oryza_db
      - REDIS_URL=redis://redis:6379
      - NEWS_API_KEY=${NEWS_API_KEY}
    ports:
      - "8004:8004"
    depends_on:
      - postgres
      - mongodb
      - redis
    networks:
      - oryza-network
    volumes:
      - ./backend/services/news-sentiment:/app
