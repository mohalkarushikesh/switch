version: '3.8'

services:
  # Databases
  postgres:
    image: postgres:15-alpine
    container_name: oryza-postgres
    environment:
      POSTGRES_USER: oryza_user
      POSTGRES_PASSWORD: oryza_pass
      POSTGRES_DB: oryza_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - oryza-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oryza_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: oryza-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: oryza_user
      MONGO_INITDB_ROOT_PASSWORD: oryza_pass
      MONGO_INITDB_DATABASE: oryza_logs
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - oryza-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oryza-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - oryza-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.14.0
    container_name: oryza-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_max__size: 512M
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
    networks:
      - oryza-network

  influxdb:
    image: influxdb:2.7-alpine
    container_name: oryza-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: oryza_user
      DOCKER_INFLUXDB_INIT_PASSWORD: oryza_pass
      DOCKER_INFLUXDB_INIT_ORG: oryza
      DOCKER_INFLUXDB_INIT_BUCKET: market_data
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: your-influx-token
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - oryza-network

  # Message Queue
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: oryza-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: oryza_user
      RABBITMQ_DEFAULT_PASS: oryza_pass
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - oryza-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka (optional, for high-throughput scenarios)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: oryza-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - oryza-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: oryza-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - oryza-network

  # Backend Services
  api-gateway:
    build:
      context: ./backend/services/api-gateway
      dockerfile: Dockerfile
    container_name: oryza-api-gateway
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://oryza_user:oryza_pass@postgres:5432/oryza_db
      - MONGODB_URL=mongodb://oryza_user:oryza_pass@mongodb:27017/oryza_db
      - REDIS_URL=redis://redis:6379
      - NEO4J_URL=bolt://neo4j:7687
      - INFLUXDB_URL=http://influxdb:8086
      - RABBITMQ_URL=amqp://oryza_user:oryza_pass@rabbitmq:5672/
      - KAFKA_BROKER=kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mongodb
      - redis
      - rabbitmq
    networks:
      - oryza-network
    volumes:
      - ./backend/services/api-gateway:/app
      - ./backend/shared:/app/shared
    command: uvicorn src.main:app --host 0.0.0.0 --port 8080 --reload

  advisory-engine:
    build:
      context: ./backend/services/advisory-engine
      dockerfile: Dockerfile
    container_name: oryza-advisory-engine
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://oryza_user:oryza_pass@postgres:5432/oryza_db
      - REDIS_URL=redis://redis:6379
      - RABBITMQ_URL=amqp://oryza_user:oryza_pass@rabbitmq:5672/
    ports:
      - "8001:8001"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    networks:
      - oryza-network
    volumes:
      - ./backend/services/advisory-engine:/app
      - ./backend/shared:/app/shared
    command: uvicorn src.main:app --host 0.0.0.0 --port 8001 --reload

  multi-agent-optimizer:
    build:
      context: ./backend/services/multi-agent-optimizer
      dockerfile: Dockerfile
    container_name: oryza-multi-agent-optimizer
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://oryza_user:oryza_pass@postgres:5432/oryza_db
      - NEO4J_URL=bolt://neo4j:7687
      - REDIS_URL=redis://redis:6379
    ports:
      - "8002:8002"
    depends_on:
