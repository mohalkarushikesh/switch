      dockerfile: Dockerfile
    container_name: oryza-user-emotion-tracker
    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://oryza_user:oryza_pass@postgres:5432/oryza_db
      - REDIS_URL=redis://redis:6379
      - INFLUXDB_URL=http://influxdb:8086
    ports:
      - "8005:8005"
    depends_on:
      - postgres
      - redis
      - influxdb
    networks:
