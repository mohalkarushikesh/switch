# Optional infrastructure. The app runs without this (embedded Qdrant + SQLite +
# in-process cache); bring these up and fill QDRANT_URL / POSTGRES_DSN / REDIS_URL
# in .env to use the real services.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Schema and sample data are created by `rag-ingest --seed-sql`, which works
    # against both PostgreSQL and the SQLite fallback.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ops"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"

volumes:
  qdrant_storage:
  postgres_data:
