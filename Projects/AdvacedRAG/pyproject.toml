[project]
name = "advanced-rag"
version = "0.1.0"
description = "Enterprise Advanced RAG for Kubernetes IT operations: hybrid search, reranking, HyDE, CRAG, Self-RAG, Text2SQL, caching and guardrails on LangGraph"
readme = "Readme.md"
requires-python = ">=3.11"

dependencies = [
    # LLM
    "anthropic>=0.40",
    # Orchestration
    "langgraph>=0.2.60",
    # Retrieval
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    # Porter2 stemmer for the no-download BM25 backend (pure Python, no model).
    "snowballstemmer>=2.2",
    # API + UI
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "streamlit>=1.40",
    "httpx",
    # Data / cache
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    # Config
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # Corporate TLS proxies: validate against the OS trust store, not certifi.
    "truststore>=0.9",
]

[project.optional-dependencies]
eval = ["ragas>=0.2", "datasets>=3.0", "pandas>=2.2"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
rag-ingest = "advanced_rag.ingestion.cli:main"
rag-api = "advanced_rag.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/advanced_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
