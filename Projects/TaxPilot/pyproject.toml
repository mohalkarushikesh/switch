[project]
name = "taxpilot"
version = "0.1.0"
description = "Autonomous tax-prep copilot: multi-agent LangGraph pipeline that reads tax documents, grounds deductions in IRS rules via RAG, computes liability with a deterministic engine (never the LLM), scores audit risk and routes uncertain returns to a human"
readme = "Readme.md"
requires-python = ">=3.11"

dependencies = [
    # LLM
    "anthropic>=0.40",
    # Orchestration
    "langgraph>=0.2.60",
    # API + web UI (the front end is static files served by FastAPI - no Node build)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx",
    # Config / models
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # Corporate TLS proxies: validate against the OS trust store, not certifi.
    "truststore>=0.9",
]

[project.optional-dependencies]
# OCR for scanned/photographed documents. Tesseract itself is a system binary;
# without it (or these packages) intake reads text/markdown/json documents directly.
ocr = ["pytesseract>=0.3.10", "pillow>=10.0", "pypdf>=5.0"]
# Gemini backend, selected with LLM_PROVIDER=gemini.
gemini = ["google-genai>=1.0"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8"]

[project.scripts]
tax-ingest = "taxpilot.knowledge.ingest:main"
tax-api = "taxpilot.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxpilot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
